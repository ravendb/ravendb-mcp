name: "1. Build & GitHub Release"

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Verify version sync
        id: v
        shell: pwsh
        run: |
          $csproj = [xml](Get-Content src/RavenDB.Mcp/RavenDB.Mcp.csproj)
          $version = ($csproj.Project.PropertyGroup | Where-Object { $_.Version }).Version
          $server = Get-Content .mcp/server.json -Raw | ConvertFrom-Json
          $npm = Get-Content npm/package.json -Raw | ConvertFrom-Json
          $bad = @()
          if ($server.version -ne $version) { $bad += "server.json=$($server.version)" }
          foreach ($p in $server.packages) { if ($p.version -ne $version) { $bad += "server.json[$($p.registryType)]=$($p.version)" } }
          if ($npm.version -ne $version) { $bad += "npm=$($npm.version)" }
          foreach ($d in $npm.optionalDependencies.PSObject.Properties) { if ($d.Value -ne $version) { $bad += "npm[$($d.Name)]=$($d.Value)" } }
          if ($bad.Count -gt 0) { Write-Error "Version mismatch (csproj=$version): $($bad -join '; ')"; exit 1 }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build self-contained executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          foreach ($rid in @('win-x64', 'win-arm64', 'linux-x64', 'osx-x64', 'osx-arm64')) {
            dotnet publish src/RavenDB.Mcp/RavenDB.Mcp.csproj -c Release -r $rid --self-contained true -p:PublishSingleFile=true -o "artifacts/publish/$rid"
            if ($rid.StartsWith('win-')) {
              Compress-Archive -Path "artifacts/publish/$rid/*" -DestinationPath "artifacts/ravendb-mcp-$rid.zip" -Force
            } else {
              tar -czf "artifacts/ravendb-mcp-$rid.tar.gz" -C "artifacts/publish/$rid" .
            }
          }

      # Reuses the binaries published above via --skip-build. Without this the .mcpb only ever
      # exists on a developer machine, and the Claude Desktop install instructions point at nothing.
      - name: Build Claude Desktop extension (.mcpb)
        shell: pwsh
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          npm install -g @anthropic-ai/mcpb@2
          node mcpb/build.mjs --skip-build
          Copy-Item "dist/ravendb-mcp-$env:VERSION.mcpb" artifacts/

      - name: Checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem artifacts -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content artifacts/checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            artifacts/ravendb-mcp-*.zip
            artifacts/ravendb-mcp-*.tar.gz
            artifacts/ravendb-mcp-*.mcpb

      # Explicit globs, not artifacts/*, because artifacts/ now also holds the publish/ staging tree.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ steps.v.outputs.version }}"
          artifacts/ravendb-mcp-*.zip
          artifacts/ravendb-mcp-*.tar.gz
          artifacts/ravendb-mcp-*.mcpb
          artifacts/checksums.txt
          --generate-notes
